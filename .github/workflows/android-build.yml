name: Android CI

on:
  push:
    branches:
      - devel
      - master
  pull_request:
    branches:
      - devel
      - master
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx2g -Dorg.gradle.daemon=false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app
        uses: actions/checkout@v4
        with:
          path: kotatsu-ios

      - name: Checkout parsers
        uses: actions/checkout@v4
        with:
          repository: Admin-Dev-git/kotatsu-parsers
          path: kotatsu-parsers

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"
          yes | sdkmanager --licenses || true

      - name: Configure local.properties
        working-directory: kotatsu-ios
        run: echo "sdk.dir=${ANDROID_SDK_ROOT}" >> local.properties

      - name: Publish parsers to Maven Local
        working-directory: kotatsu-parsers
        run: ./gradlew publishToMavenLocal -x test --no-daemon --stacktrace

      - name: Build release APK
        working-directory: kotatsu-ios
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: kotatsu-ios/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
