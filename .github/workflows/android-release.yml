name: Android Release CI

on:
  push:
    branches:
      - devel
      - master
      - fix/cloudflare-captcha-loop
  pull_request:
    branches:
      - devel
      - master
  workflow_dispatch:
    inputs:
      variant:
        description: 'Build variant to assemble'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - nightly
      parsers_ref:
        description: 'kotatsu-parsers branch/tag/SHA to build against (blank = its default branch)'
        required: false
        default: 'fix/cloudflare-captcha-loop'
        type: string

concurrency:
  group: android-release-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # kotatsu-parsers repo to publish from (change to clawzex/kotatsu-parsers for your fork)
  PARSERS_REPO: Admin-Dev-git/kotatsu-parsers
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx2g -Dorg.gradle.daemon=false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app
        uses: actions/checkout@v4
        with:
          path: kotatsu-ios

      - name: Checkout parsers
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PARSERS_REPO }}
          # The captcha fix spans both repos — CloudFlareHelper's detection changes (429 is not a
          # captcha; a challenge needs a real container, not just a turnstile script tag) live on the
          # parsers branch of the same name. A dispatch follows the parsers_ref input; a push to this
          # branch pairs with the matching parsers branch; anything else stays blank, which
          # actions/checkout reads as "that repository's default branch".
          ref: ${{ github.event.inputs.parsers_ref || (github.ref_name == 'fix/cloudflare-captcha-loop' && 'fix/cloudflare-captcha-loop' || '') }}
          path: kotatsu-parsers

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"
          yes | sdkmanager --licenses || true

      - name: Configure local.properties
        working-directory: kotatsu-ios
        run: echo "sdk.dir=${ANDROID_SDK_ROOT}" >> local.properties

      - name: Resolve keystore for release signing
        # app/debug.keystore is committed to the repo and app/build.gradle points its `debug`
        # signingConfig straight at it, so a plain checkout can already sign. The optional
        # KOTATSU_KEYSTORE_B64 secret overrides that file when you would rather keep the key out of
        # the tree — generate it with: cat app/debug.keystore | base64 | tr -d '\n'
        env:
          KOTATSU_KEYSTORE_B64: ${{ secrets.KOTATSU_KEYSTORE_B64 }}
        run: |
          if [[ -n "${KOTATSU_KEYSTORE_B64}" ]]; then
            echo "${KOTATSU_KEYSTORE_B64}" | base64 -d > kotatsu-ios/app/debug.keystore
            echo "Signing with the keystore from the KOTATSU_KEYSTORE_B64 secret."
          elif [[ -s kotatsu-ios/app/debug.keystore ]]; then
            echo "Signing with the debug.keystore committed to the repository."
          else
            echo "::error::No keystore available: KOTATSU_KEYSTORE_B64 is unset and app/debug.keystore is missing."
            exit 1
          fi

      - name: Publish parsers to Maven Local
        working-directory: kotatsu-parsers
        run: ./gradlew publishToMavenLocal -x test --no-daemon --stacktrace

      - name: Build ${{ github.event.inputs.variant || 'release' }} APK
        working-directory: kotatsu-ios
        # No -Psigning.* flags: the signingConfig in app/build.gradle hardcodes the store, alias and
        # passwords, so properties passed here were silently ignored.
        run: |
          ./gradlew \
            assemble${{ github.event.inputs.variant || 'release' }} \
            --no-daemon \
            --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ github.event.inputs.variant || 'release' }}-apk
          path: |
            kotatsu-ios/app/build/outputs/apk/${{ github.event.inputs.variant || 'release' }}/**/*.apk
          if-no-files-found: error
          retention-days: 14
